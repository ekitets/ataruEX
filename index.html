<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寮の食数管理</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');

  :root {
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #0F6E56;
    --red: #e53935;
    --red-light: #FEECEC;
    --text: #1a1a1a;
    --text-sub: #666;
    --text-hint: #aaa;
    --border: rgba(0,0,0,0.1);
    --border-hover: rgba(0,0,0,0.2);
    --bg: #f7f7f5;
    --surface: #ffffff;
    --surface2: #f2f2f0;
    --radius: 10px;
    --radius-lg: 14px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .app { max-width: 480px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

  .screen { display: none; }
  .screen.active { display: block; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .logo {
    font-size: 16px; font-weight: 700; color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
  .header-right { display: flex; gap: 6px; align-items: center; }
  .week-chip {
    font-size: 12px; color: var(--text-sub); background: var(--surface2);
    padding: 4px 10px; border-radius: 20px;
  }
  .icon-btn {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 5px 10px; font-size: 12px;
    cursor: pointer; font-family: inherit; transition: all .12s;
    color: var(--text-sub);
  }
  .icon-btn:hover { border-color: var(--border-hover); color: var(--text); }

  h2 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .sub { font-size: 13px; color: var(--text-sub); margin-bottom: 1.5rem; line-height: 1.6; }

  /* User grid */
  .user-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 1.25rem; }
  .ucard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
    cursor: pointer; text-align: left; transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ucard:hover { border-color: var(--border-hover); background: #fafaf8; }
  .ucard.done { border-color: var(--green); }
  .av {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 14px; flex-shrink: 0;
  }
  .av0{background:#EEEDFE;color:#3C3489;} .av1{background:#E1F5EE;color:#085041;}
  .av2{background:#FAECE7;color:#712B13;} .av3{background:#FBEAF0;color:#72243E;}
  .av4{background:#E6F1FB;color:#0C447C;} .av5{background:#EAF3DE;color:#27500A;}
  .av6{background:#FEF3CD;color:#7A5C00;}
  .uname { font-size: 14px; font-weight: 500; }
  .done-chip {
    margin-left: auto; font-size: 11px; background: var(--green-light);
    color: var(--green-dark); padding: 2px 7px; border-radius: 20px; white-space: nowrap;
  }

  /* Buttons */
  .btn-primary {
    width: 100%; padding: 13px; background: var(--green); color: #fff;
    border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700;
    font-family: inherit; cursor: pointer; transition: background .15s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-primary:hover { background: var(--green-dark); }
  .btn-secondary {
    flex: 1; padding: 10px 8px; background: var(--surface2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius); font-size: 12px;
    font-family: inherit; cursor: pointer; transition: all .15s;
    display: flex; align-items: center; justify-content: center; gap: 4px;
  }
  .btn-secondary:hover { border-color: var(--border-hover); }

  /* Back */
  .back-btn {
    display: flex; align-items: center; gap: 6px; font-size: 13px;
    color: var(--text-sub); background: none; border: none; cursor: pointer;
    margin-bottom: 1.25rem; font-family: inherit; padding: 0;
  }
  .back-btn:hover { color: var(--text); }

  /* Input screen */
  .user-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.25rem; }
  .user-header .av { width: 44px; height: 44px; font-size: 16px; }

  /* Quick buttons */
  .quick-wrap { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1rem; }
  .qbtn {
    font-size: 12px; padding: 5px 11px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-sub); cursor: pointer; font-family: inherit;
    transition: all .12s; white-space: nowrap;
  }
  .qbtn:hover { border-color: var(--border-hover); color: var(--text); }

  /* Day cards */
  .day-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 7px; overflow: hidden;
  }
  .day-card.past { opacity: 0.55; }
  .day-card.all-blocked { background: #fafafa; }
  .day-head {
    padding: 9px 14px; font-size: 13px; font-weight: 700;
    background: var(--surface2); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .day-summary { font-size: 11px; font-weight: 400; color: var(--text-hint); }
  .meal-row { display: flex; align-items: center; padding: 9px 14px; gap: 10px; }
  .meal-row + .meal-row { border-top: 1px solid var(--border); }
  .mlbl { font-size: 13px; color: var(--text-sub); width: 38px; flex-shrink: 0; }
  .tg { display: flex; gap: 5px; }
  .tb {
    font-size: 12px; padding: 6px 13px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-sub); cursor: pointer; font-family: inherit; transition: all .12s;
  }
  .tb.yes { background: var(--green); border-color: var(--green); color: #fff; font-weight: 500; }
  .tb.no  { background: var(--surface2); color: var(--text-hint); }
  .blocked-label {
    font-size: 11px; color: var(--red); background: var(--red-light);
    padding: 3px 9px; border-radius: 20px; white-space: nowrap;
  }
  .blocked-all-msg {
    padding: 12px 14px; font-size: 13px; color: var(--red);
    display: flex; align-items: center; gap: 6px;
  }
  .past-readonly {
    padding: 9px 14px; font-size: 13px; color: var(--text-hint);
  }

  /* Chef screen */
  .stat-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 8px; margin-bottom: 1.25rem; }
  .stat {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .stat-n { font-size: 26px; font-weight: 700; color: var(--text); }
  .stat-n span { font-size: 14px; font-weight: 400; color: var(--text-hint); }
  .stat-l { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

  .chef-actions { display: flex; gap: 8px; margin-bottom: 1rem; }

  /* Period nav */
  .period-nav {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px 12px; margin-bottom: 1rem;
  }
  .nav-btn {
    background: none; border: 1px solid var(--border); border-radius: var(--radius);
    padding: 4px 12px; cursor: pointer; font-size: 16px; font-family: inherit;
    transition: all .12s; color: var(--text-sub);
  }
  .nav-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .period-label { font-size: 13px; font-weight: 700; color: var(--text); }

  .tab-row { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 1rem; }
  .tab {
    font-size: 13px; padding: 8px 16px; background: none; border: none;
    color: var(--text-sub); cursor: pointer; font-family: inherit;
    border-bottom: 2px solid transparent; transition: all .12s;
  }
  .tab.on { color: var(--text); border-bottom-color: var(--green); font-weight: 700; }

  /* Summary table */
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th {
    font-size: 11px; font-weight: 700; color: var(--text-hint);
    padding: 6px 8px; text-align: center;
    border-bottom: 1px solid var(--border); letter-spacing: .05em;
  }
  .tbl th:first-child { text-align: left; }
  .tbl td { padding: 9px 8px; text-align: center; border-bottom: 1px solid var(--border); }
  .tbl td:first-child { text-align: left; font-weight: 500; }
  .tbl tr:last-child td { border-bottom: none; }
  .hi { color: var(--green-dark); font-weight: 700; }
  .mid { color: #185FA5; }
  .lo { color: var(--text-hint); }
  .bo-cell-tbl { font-size: 10px; color: var(--red); }

  /* Person cards */
  .pcard {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 11px 13px; margin-bottom: 7px;
  }
  .phead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .phead .av { width: 30px; height: 30px; font-size: 12px; }
  .pname { font-size: 14px; font-weight: 700; }
  .cnt-badge {
    margin-left: auto; font-size: 11px; background: var(--green-light);
    color: var(--green-dark); padding: 2px 8px; border-radius: 20px; font-weight: 700;
  }
  .dots-wrap { display: flex; gap: 3px; flex-wrap: wrap; }
  .daycol { text-align: center; flex: 0 0 calc(100%/7 - 3px); min-width: 0; }
  .dot {
    width: 100%; padding: 2px 0; border-radius: 3px; font-size: 9px;
    display: flex; align-items: center; justify-content: center; margin-bottom: 2px;
    font-weight: 500;
  }
  .dy { background: var(--green-light); color: var(--green-dark); }
  .dn { background: var(--surface2); color: var(--text-hint); }
  .dbo { background: var(--red-light); color: var(--red); }
  .dlbl { font-size: 9px; color: var(--text-hint); }
  .not-yet { font-size: 13px; color: var(--text-hint); font-style: italic; }

  /* Blackout section */
  .bo-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 1rem; overflow: hidden;
  }
  .bo-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; cursor: pointer; user-select: none;
  }
  .bo-header:hover { background: var(--surface2); }
  .bo-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .bo-toggle-icon { font-size: 12px; color: var(--text-hint); transition: transform .2s; }
  .bo-toggle-icon.open { transform: rotate(180deg); }
  .bo-body { display: none; padding: 10px; border-top: 1px solid var(--border); }
  .bo-body.open { display: block; }
  .bo-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
  }
  .bo-cell {
    background: var(--surface2); border-radius: 6px; padding: 6px 4px;
    text-align: center;
  }
  .bo-cell.past { opacity: 0.4; pointer-events: none; }
  .bo-date { font-size: 10px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .bo-day { font-size: 9px; color: var(--text-hint); margin-bottom: 4px; }
  .bo-meals { display: flex; flex-direction: column; gap: 2px; }
  .bo-btn {
    font-size: 10px; padding: 3px 0; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text-sub); cursor: pointer;
    font-family: inherit; transition: all .12s; width: 100%;
  }
  .bo-btn.blocked {
    background: var(--red); border-color: var(--red); color: #fff; font-weight: 700;
  }

  /* Reset btn */
  .reset-btn {
    font-size: 12px; color: var(--text-hint); background: none; border: none;
    cursor: pointer; font-family: inherit; padding: 6px 10px;
    border-radius: var(--radius); border: 1px solid var(--border);
  }
  .reset-btn:hover { color: #c0392b; border-color: #c0392b; }

  /* Loading */
  .loading {
    text-align: center; color: var(--text-hint); font-size: 13px;
    padding: 2rem 0;
  }
  .spinner {
    width: 20px; height: 20px; border: 2px solid var(--border);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin .7s linear infinite; margin: 0 auto 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #1a1a1a; color: #fff; font-size: 13px; padding: 10px 20px;
    border-radius: 20px; transition: transform .3s; z-index: 999; white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Modal / Bottom Sheet */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: flex-end; z-index: 200;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal-sheet {
    background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 1.25rem 1rem 2rem; width: 100%; max-height: 75vh;
    overflow-y: auto; transform: translateY(100%); transition: transform .25s;
  }
  .modal-overlay.open .modal-sheet { transform: translateY(0); }
  .modal-title {
    font-size: 15px; font-weight: 700; margin-bottom: 1rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-close {
    background: none; border: none; font-size: 18px; cursor: pointer;
    color: var(--text-hint); padding: 0; line-height: 1;
  }

  /* User list in modal */
  .ulist-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .ulist-item:last-child { border-bottom: none; }
  .del-btn {
    margin-left: auto; font-size: 11px; color: #c0392b;
    background: none; border: 1px solid rgba(192,57,43,0.3); border-radius: 20px;
    padding: 3px 10px; cursor: pointer; font-family: inherit; flex-shrink: 0;
    transition: all .12s;
  }
  .del-btn:hover { background: #c0392b; color: #fff; border-color: #c0392b; }
  .add-row {
    display: flex; gap: 8px; margin-top: 1rem; align-items: center;
  }
  .add-row input {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 14px; font-family: inherit;
    background: var(--bg); color: var(--text); transition: border-color .12s;
  }
  .add-row input:focus { outline: none; border-color: var(--green); }
  .add-row .add-btn {
    padding: 9px 16px; background: var(--green); color: #fff;
    border: none; border-radius: var(--radius); font-size: 13px; font-weight: 700;
    font-family: inherit; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: background .12s;
  }
  .add-row .add-btn:hover { background: var(--green-dark); }
  .empty-users {
    font-size: 13px; color: var(--text-hint); padding: 12px 0; text-align: center;
  }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- User management modal -->
<div class="modal-overlay" id="user-modal">
  <div class="modal-sheet">
    <div class="modal-title">
      <span>👤 ユーザー管理</span>
      <button class="modal-close" onclick="closeUserModal()">✕</button>
    </div>
    <div id="ulist"></div>
    <div class="add-row">
      <input type="text" id="new-user-input" placeholder="名前を入力（最大10文字）" maxlength="10"
             onkeydown="if(event.key==='Enter')addUserFromModal()">
      <button class="add-btn" onclick="addUserFromModal()">追加</button>
    </div>
  </div>
</div>

<div class="app">

  <!-- Home screen -->
  <div class="screen active" id="s-home">
    <div class="header">
      <div class="logo"><div class="logo-dot"></div>寮ごはん</div>
      <div class="header-right">
        <button class="icon-btn" onclick="openUserModal()">👤 管理</button>
        <div class="week-chip" id="week-disp"></div>
      </div>
    </div>
    <h2>来週のご飯</h2>
    <p class="sub">名前を選んで食べる日を入力してください</p>
    <div class="user-grid" id="home-grid">
      <div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>読み込み中...</div>
    </div>
    <button class="btn-primary" onclick="go('s-chef')">
      📊 シェフ集計画面
    </button>
  </div>

  <!-- Input screen -->
  <div class="screen" id="s-input">
    <button class="back-btn" onclick="go('s-home')">← 戻る</button>
    <div class="user-header">
      <div class="av" id="in-av"></div>
      <div>
        <div style="font-size:16px;font-weight:700;" id="in-name"></div>
        <div style="font-size:12px;color:var(--text-sub);" id="in-period"></div>
      </div>
    </div>
    <div class="quick-wrap">
      <button class="qbtn" onclick="qset('all',true)">✅ 全部食べる</button>
      <button class="qbtn" onclick="qset('all',false)">❌ 全部外す</button>
      <button class="qbtn" onclick="qset('b',true)">🌅 朝食すべて</button>
      <button class="qbtn" onclick="qset('d',true)">🌙 夕食すべて</button>
      <button class="qbtn" onclick="qset('b',false)">朝食を外す</button>
      <button class="qbtn" onclick="qset('d',false)">夕食を外す</button>
    </div>
    <div id="day-rows"></div>
    <button class="btn-primary" style="margin-top:1rem;" onclick="saveUser()">
      💾 保存して戻る
    </button>
  </div>

  <!-- Chef screen -->
  <div class="screen" id="s-chef">
    <button class="back-btn" onclick="go('s-home')">← 戻る</button>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;">
      <h2>集計ダッシュボード</h2>
      <button class="reset-btn" onclick="resetPeriod()">🗑 リセット</button>
    </div>
    <div class="period-nav">
      <button class="nav-btn" onclick="shiftChefOffset(-1)">‹</button>
      <span class="period-label" id="chef-period-label">—</span>
      <button class="nav-btn" onclick="shiftChefOffset(1)">›</button>
    </div>
    <div class="stat-grid" id="stat-grid">
      <div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>読み込み中...</div>
    </div>
    <div class="chef-actions">
      <button class="btn-secondary" onclick="exportCSV('day')">📥 日別CSV</button>
      <button class="btn-secondary" onclick="exportCSV('person')">📥 個人別CSV</button>
    </div>

    <!-- Blackout section -->
    <div class="bo-section">
      <div class="bo-header" onclick="toggleBoSection()">
        <span class="bo-title">🚫 提供不可日の設定</span>
        <span class="bo-toggle-icon" id="bo-icon">▼</span>
      </div>
      <div class="bo-body" id="bo-body">
        <div class="bo-grid" id="bo-grid"></div>
      </div>
    </div>

    <div class="tab-row">
      <button class="tab on" id="tab-s" onclick="switchTab('s')">日別まとめ</button>
      <button class="tab" id="tab-p" onclick="switchTab('p')">個人別</button>
      <button class="tab" id="tab-l" onclick="switchTab('l')">保存ログ</button>
    </div>
    <div id="tab-s-content"></div>
    <div id="tab-p-content" style="display:none;"></div>
    <div id="tab-l-content" style="display:none;"></div>
  </div>

</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getDatabase, ref, set, get, update, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyD_fMbNMe2OQtok5Ltl37aryVLBrLRjWEU",
  authDomain: "ryoushoku-kanri.firebaseapp.com",
  databaseURL: "https://ryoushoku-kanri-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ryoushoku-kanri",
  storageBucket: "ryoushoku-kanri.firebasestorage.app",
  messagingSenderId: "922263738558",
  appId: "1:922263738558:web:2aebe7054ddaefdcc726ef"
};

const DAY_JA       = ['日','月','火','水','木','金','土'];
const MEALS        = ['朝','夕'];
const AV           = ['av0','av1','av2','av3','av4','av5','av6'];
const DEFAULT_USERS = ['下田','吉田','鈴木','小野','岸本','黒田','宇田川'];

let app, db;
let USERS      = [];
let curUser    = null;
let curAvCls   = '';
let tmp        = {};       // {dateKey: {朝:bool,夕:bool}} for current input
let curDates   = [];       // 14 Date objects for current input period
let allData    = {};       // {userName: {dateKey: {朝:bool,夕:bool}}}
let blackout   = {};       // {dateKey: {朝:bool,夕:bool}} true = blocked
let chefOffset = 0;        // period offset for chef screen
let activeTab  = 's';
let dc         = {};       // day counts for CSV

const configOK = firebaseConfig.apiKey !== 'YOUR_API_KEY';

if (configOK) {
  app = initializeApp(firebaseConfig);
  db  = getDatabase(app);
}

// ---- Date utilities ----

function getMonday(d) {
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  const day = date.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  date.setDate(date.getDate() + diff);
  return date;
}

function getPeriodDates(offset = 0) {
  const mon = getMonday(new Date());
  mon.setDate(mon.getDate() + offset * 7);
  return Array.from({ length: 7 }, (_, i) => {
    const d = new Date(mon);
    d.setDate(mon.getDate() + i);
    return d;
  });
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function dateLabel(d) {
  return `${d.getMonth() + 1}/${d.getDate()}`;
}

function dateLabelLong(d) {
  return `${DAY_JA[d.getDay()]}曜日 ${d.getMonth() + 1}月${d.getDate()}日`;
}

function periodLabel(dates) {
  const s = dates[0], e = dates[6];
  return `${s.getMonth()+1}/${s.getDate()} 〜 ${e.getMonth()+1}/${e.getDate()}`;
}

function isPast(d) {
  const today = new Date(); today.setHours(0,0,0,0);
  return d < today;
}

function isDefaultBlocked(dateK, meal) {
  const dow = new Date(dateK + 'T00:00:00').getDay();
  if (dow === 1) return true;           // Monday: 朝 and 夕
  if (dow === 0 && meal === '夕') return true; // Sunday: 夕 only
  return false;
}

function isEffectivelyBlocked(dateK, meal) {
  if (blackout[dateK] !== undefined && blackout[dateK][meal] !== undefined) {
    return !!blackout[dateK][meal];
  }
  return isDefaultBlocked(dateK, meal);
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

function go(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if (id === 's-home') renderHome();
  if (id === 's-chef') renderChef();
}
window.go = go;

// ---- Firebase helpers ----

async function fbLoadPeriod(dates) {
  if (!configOK) return {};
  const keys = dates.map(dateKey);
  // Load all users' data
  const result = {};
  try {
    const snap = await get(ref(db, 'meals'));
    if (!snap.exists()) return {};
    snap.forEach(userSnap => {
      const uname = userSnap.key;
      const udata = userSnap.val();
      result[uname] = {};
      keys.forEach(k => {
        if (udata[k]) result[uname][k] = udata[k];
      });
    });
  } catch(e) { /* ignore */ }
  return result;
}

async function fbLoadBlackout() {
  if (!configOK) return {};
  try {
    const snap = await get(ref(db, 'config/blackout'));
    return snap.exists() ? snap.val() : {};
  } catch(e) { return {}; }
}

async function fbSaveUserPeriod(userName, data, dates) {
  if (!configOK) return;
  const updates = {};
  dates.forEach(d => {
    const k = dateKey(d);
    updates[`meals/${userName}/${k}`] = data[k] || { 朝: false, 夕: false };
  });
  await update(ref(db), updates);
}

async function fbToggleBlackout(dateK, meal) {
  const current = isEffectivelyBlocked(dateK, meal);
  if (!blackout[dateK]) blackout[dateK] = {};
  blackout[dateK][meal] = !current;
  const aVal = blackout[dateK]['朝'] !== undefined ? blackout[dateK]['朝'] : isDefaultBlocked(dateK, '朝');
  const dVal = blackout[dateK]['夕'] !== undefined ? blackout[dateK]['夕'] : isDefaultBlocked(dateK, '夕');
  if (!aVal && !dVal && !isDefaultBlocked(dateK, '朝') && !isDefaultBlocked(dateK, '夕')) {
    delete blackout[dateK];
    await remove(ref(db, `config/blackout/${dateK}`));
  } else {
    const toSave = { 朝: aVal, 夕: dVal };
    blackout[dateK] = toSave;
    await set(ref(db, `config/blackout/${dateK}`), toSave);
  }
}

async function fbDeletePeriod(dates) {
  if (!configOK) return;
  const updates = {};
  USERS.forEach(u => {
    dates.forEach(d => {
      updates[`meals/${u.name}/${dateKey(d)}`] = null;
    });
  });
  await update(ref(db), updates);
}

async function fbSaveLog(userName, type, weekStart) {
  if (!configOK) return;
  const ts  = Date.now();
  const now = new Date().toISOString().slice(0, 16).replace('T', ' ');
  await set(ref(db, `logs/${userName}/${ts}`), { type, weekStart, savedAt: now });
}

async function fbLoadLogs() {
  if (!configOK) return {};
  try {
    const snap = await get(ref(db, 'logs'));
    return snap.exists() ? snap.val() : {};
  } catch(e) { return {}; }
}

// ---- User management (Firebase) ----

async function loadUsers() {
  if (!configOK) {
    USERS = DEFAULT_USERS.map((n, i) => ({ name: n, av: i }));
    return;
  }
  try {
    const snap = await get(ref(db, 'config/users'));
    if (snap.exists()) {
      const data = snap.val();
      USERS = Object.entries(data).map(([name, av]) => ({ name, av }));
    } else {
      USERS = DEFAULT_USERS.map((n, i) => ({ name: n, av: i }));
      await persistUsers();
    }
  } catch(e) {
    USERS = DEFAULT_USERS.map((n, i) => ({ name: n, av: i }));
  }
}

async function persistUsers() {
  if (!configOK) return;
  const obj = {};
  USERS.forEach(u => { obj[u.name] = u.av; });
  await set(ref(db, 'config/users'), obj);
}

window.addUserFromModal = async function() {

window.deleteUserByName = async function(name) {
  if (!confirm(`「${name}」を削除しますか？\n（入力済みのデータは残ります）`)) return;

  renderUserList();

};

async function renderHome() {
  const inputDates = getPeriodDates(0); // always show current 2-week period for input
  document.getElementById('week-disp').textContent = periodLabel(inputDates);

  if (!configOK) {
    document.getElementById('home-grid').innerHTML = `
      <div style="grid-column:1/-1;background:#fffbeb;border:1px solid #f59e0b;
        border-radius:var(--radius);padding:1rem;font-size:13px;line-height:1.7;">
        <strong style="display:block;margin-bottom:4px;color:#92400e;">⚠️ Firebase設定が必要です</strong>

      </div>`;

  }

  const grid = document.getElementById('home-grid');

  allData  = await fbLoadPeriod(inputDates);

// ---- Input ----

function openInput(user, dates) {
  curUser    = user.name;
  curAvCls   = AV[user.av % AV.length];
  curDates   = dates;

  tmp = {};
  dates.forEach(d => {
    const k = dateKey(d);
    if (allData[user.name]?.[k]) {
      tmp[k] = { ...allData[user.name][k] };
    } else {
      tmp[k] = { 朝: !isEffectivelyBlocked(k, '朝'), 夕: !isEffectivelyBlocked(k, '夕') };
    }
    if (isEffectivelyBlocked(k, '朝')) tmp[k]['朝'] = false;
    if (isEffectivelyBlocked(k, '夕')) tmp[k]['夕'] = false;
  });

  document.getElementById('in-name').textContent = user.name + 'さん';
  document.getElementById('in-period').textContent = periodLabel(dates);
  const av = document.getElementById('in-av');
  av.className = 'av ' + curAvCls;
  av.textContent = user.name[0];
  renderDayRows();
  go('s-input');
}

function renderDayRows() {
  const wrap = document.getElementById('day-rows');
  wrap.innerHTML = '';
  curDates.forEach(d => {
    const k    = dateKey(d);
    const past = isPast(d);
    const boA  = isEffectivelyBlocked(k, '朝');
    const boD  = isEffectivelyBlocked(k, '夕');
    const allBo = boA && boD;

    const card = document.createElement('div');
    card.className = 'day-card' + (past ? ' past' : '') + (allBo ? ' all-blocked' : '');

    const hasB    = tmp[k]?.['朝'];
    const hasD    = tmp[k]?.['夕'];
    const sumText = (allBo ? '提供なし' : [hasB?'朝食':'', hasD?'夕食':''].filter(Boolean).join('・') || 'なし');

    let body = `<div class="day-head">${escHtml(dateLabelLong(d))}<span class="day-summary">${escHtml(sumText)}</span></div>`;

    if (past) {
      body += `<div class="past-readonly">過去の日程は変更できません</div>`;
    } else if (allBo) {
      body += `<div class="blocked-all-msg">🚫 この日は提供なし</div>`;
    } else {
      MEALS.forEach(m => {
        const mJa  = m === '朝' ? '朝食' : '夕食';
        const isBo = m === '朝' ? boA : boD;
        const v    = tmp[k]?.[m] ?? false;
        if (isBo) {
          body += `<div class="meal-row">
            <span class="mlbl">${mJa}</span>
            <span class="blocked-label">🚫 提供なし</span>
          </div>`;
        } else {
          body += `<div class="meal-row">
            <span class="mlbl">${mJa}</span>
            <div class="tg">
              <button class="tb ${v ? 'yes' : ''}" id="b-${k}-${m}-y" onclick="setM('${k}','${m}',true)">食べる</button>
              <button class="tb ${!v ? 'no' : ''}" id="b-${k}-${m}-n" onclick="setM('${k}','${m}',false)">食べない</button>
            </div>
          </div>`;
        }
      });
    }
    card.innerHTML = body;
    wrap.appendChild(card);
  });
}

window.setM = function(k, meal, val) {
  if (!tmp[k]) tmp[k] = { 朝: false, 夕: false };
  tmp[k][meal] = val;
  document.getElementById(`b-${k}-${meal}-y`).className = 'tb' + (val ? ' yes' : '');
  document.getElementById(`b-${k}-${meal}-n`).className = 'tb' + (!val ? ' no' : '');
  // update summary
  const hasB = tmp[k]['朝'], hasD = tmp[k]['夕'];
  const sumText = [hasB?'朝食':'', hasD?'夕食':''].filter(Boolean).join('・') || 'なし';
  const card = document.getElementById(`b-${k}-${meal}-y`)?.closest('.day-card');
  if (card) card.querySelector('.day-summary').textContent = sumText;
};

window.qset = function(type, val) {
  curDates.forEach(d => {
    const k = dateKey(d);
    if (isPast(d)) return;
    const meals = type === 'all' ? MEALS : type === 'b' ? ['朝'] : ['夕'];
    meals.forEach(m => {
      if (!isEffectivelyBlocked(k, m)) setM(k, m, val);
    });
  });
};

window.saveUser = async function() {
  const hasExisting = curDates.some(d => allData[curUser]?.[dateKey(d)] !== undefined);
  const logType = hasExisting ? 'update' : 'initial';
  await fbSaveUserPeriod(curUser, tmp, curDates);
  await fbSaveLog(curUser, logType, dateKey(curDates[0]));
  if (!allData[curUser]) allData[curUser] = {};
  curDates.forEach(d => { allData[curUser][dateKey(d)] = tmp[dateKey(d)]; });
  toast(logType === 'initial' ? '初回保存しました ✓' : '更新しました ✓');
  go('s-home');
};

// ---- Chef ----

window.shiftChefOffset = function(delta) {
  chefOffset += delta;
  renderChef();
};

async function renderChef() {
  const dates = getPeriodDates(chefOffset);
  document.getElementById('chef-period-label').textContent = periodLabel(dates);

  const sg = document.getElementById('stat-grid');
  sg.innerHTML = '<div class="loading" style="grid-column:1/-1;"><div class="spinner"></div>読み込み中...</div>';

  blackout = await fbLoadBlackout();
  allData  = await fbLoadPeriod(dates);
  const logs = await fbLoadLogs();

  const responded = USERS.filter(u => allData[u.name] && Object.keys(allData[u.name]).length > 0).length;
  let total = 0;
  dc = {};
  dates.forEach(d => { dc[dateKey(d)] = { 朝: 0, 夕: 0 }; });

  USERS.forEach(u => {
    const sel = allData[u.name];
    if (!sel) return;
    dates.forEach(d => {
      const k = dateKey(d);
      MEALS.forEach(m => {
        if (sel[k]?.[m]) { dc[k][m]++; total++; }
      });
    });
  });

  let maxD = { label: '-', cnt: 0 };
  dates.forEach(d => {
    const k = dateKey(d);
    const c = (dc[k]['朝'] || 0) + (dc[k]['夕'] || 0);
    if (c > maxD.cnt) maxD = { label: dateLabel(d), cnt: c };
  });
  const pct = responded > 0 ? Math.round(total / (responded * 7 * 2) * 100) : 0;

  sg.innerHTML = `
    <div class="stat"><div class="stat-n">${responded}<span>/${USERS.length}</span></div><div class="stat-l">入力済み</div></div>
    <div class="stat"><div class="stat-n">${total}</div><div class="stat-l">総食数</div></div>
    <div class="stat"><div class="stat-n">${pct}%</div><div class="stat-l">参加率</div></div>
    <div class="stat"><div class="stat-n">${escHtml(maxD.label)}</div><div class="stat-l">最多日</div></div>`;

  renderBoGrid(dates);
  renderChefTabs(dates);
  renderLogTab(logs);
  switchTab(activeTab, true);
}

function renderBoGrid(dates) {
  const grid = document.getElementById('bo-grid');
  grid.innerHTML = dates.map(d => {
    const k    = dateKey(d);
    const past = isPast(d);
    const boA  = isEffectivelyBlocked(k, '朝');
    const boD  = isEffectivelyBlocked(k, '夕');
    return `<div class="bo-cell${past ? ' past' : ''}">
      <div class="bo-date">${d.getMonth()+1}/${d.getDate()}</div>
      <div class="bo-day">${DAY_JA[d.getDay()]}</div>
      <div class="bo-meals">
        <button class="bo-btn${boA ? ' blocked' : ''}" onclick="toggleBo('${k}','朝')">朝${boA?'✕':''}</button>
        <button class="bo-btn${boD ? ' blocked' : ''}" onclick="toggleBo('${k}','夕')">夕${boD?'✕':''}</button>
      </div>
    </div>`;
  }).join('');
}

window.toggleBo = async function(k, meal) {
  await fbToggleBlackout(k, meal);
  const dates = getPeriodDates(chefOffset);
  renderBoGrid(dates);
  toast(`${k} の${meal}食を${isEffectivelyBlocked(k, meal) ? '提供不可' : '提供可'}にしました`);
};

window.toggleBoSection = function() {
  const body = document.getElementById('bo-body');
  const icon = document.getElementById('bo-icon');
  const open = body.classList.toggle('open');
  icon.classList.toggle('open', open);
};

function renderChefTabs(dates) {
  const max = USERS.length;
  const cls = n => n >= max ? 'hi' : n > 0 ? 'mid' : 'lo';

  document.getElementById('tab-s-content').innerHTML = `
    <table class="tbl">
      <thead><tr><th style="width:100px;">日付</th><th>朝食</th><th>夕食</th><th>合計</th></tr></thead>
      <tbody>${dates.map(d => {
        const k   = dateKey(d);
        const b   = dc[k]?.['朝'] ?? 0;
        const di  = dc[k]?.['夕'] ?? 0;
        const tot = b + di;
        const boA = isEffectivelyBlocked(k, '朝');
        const boD = isEffectivelyBlocked(k, '夕');
        return `<tr>
          <td>${DAY_JA[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}</td>
          <td class="${boA ? '' : cls(b)}">${boA ? '<span class="bo-cell-tbl">🚫</span>' : b + '人'}</td>
          <td class="${boD ? '' : cls(di)}">${boD ? '<span class="bo-cell-tbl">🚫</span>' : di + '人'}</td>
          <td><strong>${tot}</strong></td></tr>`;
      }).join('')}</tbody>
    </table>`;

  document.getElementById('tab-p-content').innerHTML = USERS.map(u => {
    const sel = allData[u.name];
    if (!sel || Object.keys(sel).length === 0) return `<div class="pcard"><div class="phead">
      <div class="av ${AV[u.av % AV.length]}" style="width:30px;height:30px;font-size:11px;">${escHtml(u.name[0])}</div>
      <span class="not-yet">${escHtml(u.name)} — 未入力</span></div></div>`;

    const cnt = dates.reduce((a, d) => {
      const k = dateKey(d);
      return a + (sel[k]?.['朝'] ? 1 : 0) + (sel[k]?.['夕'] ? 1 : 0);
    }, 0);

    const dots = dates.map(d => {
      const k   = dateKey(d);
      const boA = isEffectivelyBlocked(k, '朝');
      const boD = isEffectivelyBlocked(k, '夕');
      const hasB = sel[k]?.['朝'];
      const hasD = sel[k]?.['夕'];
      return `<div class="daycol">
        <div class="dot ${boA ? 'dbo' : hasB ? 'dy' : 'dn'}">${boA ? '🚫' : '朝'}</div>
        <div class="dot ${boD ? 'dbo' : hasD ? 'dy' : 'dn'}">${boD ? '🚫' : '夕'}</div>
        <div class="dlbl">${d.getMonth()+1}/${d.getDate()}</div>
      </div>`;
    }).join('');

    return `<div class="pcard">
      <div class="phead">
        <div class="av ${AV[u.av % AV.length]}" style="width:30px;height:30px;font-size:11px;">${escHtml(u.name[0])}</div>
        <span class="pname">${escHtml(u.name)}</span>
        <span class="cnt-badge">${cnt}食</span>
      </div>
      <div class="dots-wrap">${dots}</div>
    </div>`;
  }).join('');
}

function renderLogTab(logs) {
  const entries = [];
  Object.entries(logs).forEach(([userName, userLogs]) => {
    Object.entries(userLogs).forEach(([ts, entry]) => {
      entries.push({ userName, ts: parseInt(ts), ...entry });
    });
  });
  entries.sort((a, b) => b.ts - a.ts);
  const recent = entries.slice(0, 100);

  if (recent.length === 0) {
    document.getElementById('tab-l-content').innerHTML =
      '<div style="padding:1.5rem;text-align:center;font-size:13px;color:var(--text-hint);">保存ログはまだありません</div>';
    return;
  }

  document.getElementById('tab-l-content').innerHTML =
    '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;">' +
    recent.map((e, i) => {
      const u       = USERS.find(u => u.name === e.userName);
      const avCls   = u ? AV[u.av % AV.length] : 'av0';
      const isFirst = e.type === 'initial';
      const badge   = isFirst
        ? '<span style="font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;background:var(--green-light);color:var(--green-dark);">初回保存</span>'
        : '<span style="font-size:11px;padding:2px 8px;border-radius:20px;white-space:nowrap;background:#EBF3FD;color:#185FA5;">更新</span>';
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;${i > 0 ? 'border-top:1px solid var(--border);' : ''}">
        <div class="av ${avCls}" style="width:30px;height:30px;font-size:12px;flex-shrink:0;">${escHtml(e.userName[0])}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:13px;font-weight:500;">${escHtml(e.userName)}</div>
          <div style="font-size:11px;color:var(--text-hint);margin-top:1px;">${e.savedAt} &nbsp;·&nbsp; ${e.weekStart}〜の週</div>
        </div>
        ${badge}
      </div>`;
    }).join('') + '</div>';
}

window.switchTab = function(t, silent = false) {
  activeTab = t;
  ['s','p','l'].forEach(id => {
    document.getElementById(`tab-${id}`).className = 'tab' + (t === id ? ' on' : '');
    document.getElementById(`tab-${id}-content`).style.display = t === id ? '' : 'none';
  });
};

window.resetPeriod = async function() {
  const dates = getPeriodDates(chefOffset);
  if (!confirm(`${periodLabel(dates)} のデータを全員分リセットしますか？`)) return;
  await fbDeletePeriod(dates);

};

// ---- CSV Export ----

window.exportCSV = function(type) {
  const dates = getPeriodDates(chefOffset);
  let csv, filename;

  if (type === 'day') {
    csv = '日付,曜日,朝食人数,夕食人数,合計\n';
    dates.forEach(d => {
      const k  = dateKey(d);
      const b  = dc[k]?.['朝'] ?? 0;
      const di = dc[k]?.['夕'] ?? 0;
      csv += `${k},${DAY_JA[d.getDay()]},${b},${di},${b + di}\n`;
    });
    filename = `食数_日別_${dateKey(dates[0])}.csv`;
  } else {
    const headers = ['名前', ...dates.flatMap(d => [`${dateLabel(d)}朝`, `${dateLabel(d)}夕`]), '総食数'];
    csv = headers.join(',') + '\n';
    USERS.forEach(u => {
      const sel = allData[u.name];
      if (!sel) {
        csv += `${u.name},${Array(14).fill('-').join(',')},0\n`;
      } else {
        const cols = dates.flatMap(d => {
          const k = dateKey(d);
          return [sel[k]?.['朝'] ? '○' : '×', sel[k]?.['夕'] ? '○' : '×'];
        });
        const cnt = cols.filter(v => v === '○').length;
        csv += `${u.name},${cols.join(',')},${cnt}\n`;
      }
    });
    filename = `食数_個人別_${dateKey(dates[0])}.csv`;
  }

  const bom  = '﻿';
  const blob = new Blob([bom + csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('CSVをダウンロードしました 📥');
};

// ---- Start ----
(async () => {
  await loadUsers();
  renderHome();
})();
</script>
</body>
</html>
